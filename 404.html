<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#13233F;background:linear-gradient(180deg,#0E3B7A 0%,#2F78C4 55%,#FFD2A8 100%);padding:20px}

.cta{background:#FF7A2E;color:#fff}
.zap{border:1.5px solid #D3DEEA;color:#128C4A}
